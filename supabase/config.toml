# Configuration Supabase CLI — identifiant LOCAL du projet (nom du dossier),
# pas celui du projet distant. Le lien se fait avec
# `supabase link --project-ref <ref>` (voir README.md).
#
# Nora n'a AUCUNE table, et n'en aura pas pour les tenants : le Socle est la
# source de vérité des collectivités, de leurs domaines et de leurs démarches.
# Le projet Supabase ne sert ici que d'exécution à l'edge function qui porte la
# clé du Socle.
project_id = "nora"

# ── Edge functions ───────────────────────────────────────────────────────────
# Le portail est PUBLIC par nature : aucun usager n'est connecté à ce stade, il
# n'y a donc pas de JWT à vérifier. La fonction ne sert que ce que le Socle a
# déjà déclaré public.
[functions.portal-api]
verify_jwt = false
